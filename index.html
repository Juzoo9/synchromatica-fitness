<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Synchromatica Fitness</title>
<style>
  :root {
    --bg: #07100b;
    --bg-surface: #0c1a12;
    --card: #102419;
    --card-hover: #142f21;
    --card-border: #1b3d2b;
    --card-border-subtle: #153323;
    --txt: #f0f7f3;
    --txt-muted: #82a893;
    --txt-dim: #4e735f;
    --acc: #2ecc71;
    --acc-light: #48e68b;
    --acc-dark: #1b7a42;
    --acc-glow: rgba(46, 204, 113, 0.25);
    --warn: #f59e0b;
    --danger: #ef4444;
    --blue: #38bdf8;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1000px 500px at 70% -5%, #133321 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    user-select: none;
    line-height: 1.4;
  }

  #app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 85px);
  }

  /* Typography & headers */
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--acc);
    box-shadow: 0 0 14px var(--acc);
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: var(--txt);
  }
  .brand-subtitle {
    font-size: 12px;
    color: var(--txt-muted);
    font-weight: 500;
  }

  .iconbtn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--txt);
    border-radius: 12px;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn.sm { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .card.highlight {
    border-color: var(--acc-dark);
    background: linear-gradient(160deg, #102d1d 0%, var(--card) 100%);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--txt);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--txt-muted);
    line-height: 1.45;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--card-border);
    color: var(--txt-muted);
  }
  .badge.today { background: var(--acc-glow); color: var(--acc-light); border: 1px solid var(--acc-dark); }
  .badge.blue { background: rgba(56, 189, 248, 0.15); color: var(--blue); border: 1px solid rgba(56, 189, 248, 0.3); }

  /* Buttons */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 18px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--acc), var(--acc-light));
    color: #03140a;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.1px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn.ghost {
    background: var(--card-border-subtle);
    color: var(--txt);
    border: 1px solid var(--card-border);
  }
  .btn.sm {
    padding: 10px 14px;
    font-size: 13px;
    border-radius: 10px;
  }
  .btn.warn {
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  /* Schedule Day Pill & List */
  .day-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .day-card:active { transform: scale(0.985); }
  .day-card.active-today {
    border-color: var(--acc);
    box-shadow: 0 0 16px rgba(46, 204, 113, 0.15);
  }
  .day-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }
  .day-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--txt);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-info {
    font-size: 12px;
    color: var(--txt-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-action {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  /* Exercise Workout Item */
  .exblk {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .exblk-hd {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .ex-name { font-size: 16px; font-weight: 700; color: var(--txt); }
  .ex-sub { font-size: 12px; color: var(--txt-muted); margin-top: 2px; }

  .pr-hint {
    background: #0a1f14;
    border: 1px solid #173d27;
    border-radius: 9px;
    padding: 7px 11px;
    font-size: 12px;
    color: #9cd4b5;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .pr-hint b { color: var(--acc-light); font-weight: 700; }

  .setrow {
    display: grid;
    grid-template-columns: 24px 1fr 1fr 76px 34px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-idx {
    font-size: 13px;
    font-weight: 700;
    color: var(--txt-dim);
    text-align: center;
  }
  .inp {
    background: #07150e;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 8px;
    color: var(--txt);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    -moz-appearance: textfield;
  }
  .inp:focus { outline: none; border-color: var(--acc); background: #0a1c13; }
  .inp::-webkit-outer-spin-button, .inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .check-btn {
    height: 38px;
    background: var(--card-border-subtle);
    border: 1px solid var(--card-border);
    color: var(--txt-muted);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .check-btn.done {
    background: linear-gradient(135deg, var(--acc), var(--acc-light));
    color: #03140a;
    border-color: var(--acc);
    box-shadow: 0 0 12px var(--acc-glow);
  }
  .add-set-btn {
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--card-border);
    background: transparent;
    color: var(--acc-light);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s ease;
  }
  .add-set-btn:active { background: rgba(46, 204, 113, 0.08); }

  /* Rest Timer Overlay Bar */
  #rest-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 70px;
    z-index: 45;
    max-width: 520px;
    margin: 0 auto;
    background: rgba(12, 28, 19, 0.95);
    border-top: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    transform: translateY(150%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #rest-bar.show { transform: translateY(0); }
  .rest-track {
    height: 4px;
    background: #08150e;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .rest-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--acc), var(--acc-light));
    width: 100%;
    transition: width 0.2s linear;
  }
  .rest-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .rest-time {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--txt);
    cursor: pointer;
  }
  .rest-chips {
    display: flex;
    gap: 6px;
  }
  .chip {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--txt-muted);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip.active {
    background: var(--acc);
    color: #03140a;
    border-color: var(--acc);
  }

  /* Bottom Navigation Bar */
  .navbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    max-width: 520px;
    margin: 0 auto;
    background: rgba(7, 16, 11, 0.94);
    border-top: 1px solid var(--card-border-subtle);
    backdrop-filter: blur(14px);
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: none;
    color: var(--txt-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 10px;
    transition: color 0.15s ease;
  }
  .nav-item.active {
    color: var(--acc-light);
  }
  .nav-icon {
    font-size: 18px;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top) + 16px);
    transform: translateX(-50%) translateY(-140%);
    background: #143522;
    border: 1px solid var(--acc);
    color: var(--txt);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    z-index: 90;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Modal Sheet */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(4, 9, 6, 0.75);
    backdrop-filter: blur(5px);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .sheet {
    width: 100%;
    max-width: 520px;
    background: #0b1a11;
    border: 1px solid var(--card-border);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    padding: 20px 18px calc(env(safe-area-inset-bottom) + 24px);
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .field {
    margin-bottom: 14px;
  }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--txt-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .field-input, .field-select {
    width: 100%;
    background: #07150d;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--txt);
    font-size: 15px;
  }
  .field-input:focus, .field-select:focus {
    outline: none;
    border-color: var(--acc);
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat-label { font-size: 11.5px; color: var(--txt-muted); font-weight: 600; }
  .stat-val { font-size: 22px; font-weight: 800; color: var(--txt); margin-top: 4px; }
  .stat-val b { color: var(--acc-light); font-size: 14px; margin-left: 2px; }

  /* Chart SVG Container */
  .chart-container {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 12px;
    margin-bottom: 14px;
  }
  .chart-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chart-svg {
    width: 100%;
    height: 150px;
    overflow: visible;
  }

  /* History list */
  .hist-item {
    padding: 12px 6px;
    border-bottom: 1px solid var(--card-border-subtle);
    cursor: pointer;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .hist-title { font-size: 15px; font-weight: 700; color: var(--txt); }
  .hist-tonnage { font-size: 14px; font-weight: 800; color: var(--acc-light); }
  .hist-sub { font-size: 12px; color: var(--txt-muted); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--txt-muted);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  /* Exercise drag/item row in editor */
  .edit-ex-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #08170f;
    border: 1px solid var(--card-border-subtle);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- Rest Timer Floating Bar -->
<div id="rest-bar">
  <div class="rest-track"><div class="rest-fill" id="restFill"></div></div>
  <div class="rest-content">
    <div class="rest-time" id="restTime" title="Нажмите, чтобы сбросить">1:30</div>
    <div class="rest-chips" id="restChips"></div>
  </div>
</div>

<!-- Bottom Navigation Bar -->
<nav class="navbar" id="navbar">
  <button class="nav-item active" data-view="home">
    <span class="nav-icon">🏠</span>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-view="programs">
    <span class="nav-icon">📋</span>
    <span>Расписание</span>
  </button>
  <button class="nav-item" data-view="stats">
    <span class="nav-icon">📈</span>
    <span>Прогресс</span>
  </button>
  <button class="nav-item" data-view="history">
    <span class="nav-icon">📜</span>
    <span>История</span>
  </button>
</nav>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Sheet Modal -->
<div class="modal-overlay" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
'use strict';

/* =========================================================
   1. Telegram Integration & Haptics
   ========================================================= */
const WTA = (window.Telegram && window.Telegram.WebApp) || null;
if (WTA) {
  try {
    WTA.ready();
    WTA.expand();
    if (WTA.setHeaderColor) WTA.setHeaderColor('#07100b');
    if (WTA.setBackgroundColor) WTA.setBackgroundColor('#07100b');
  } catch (e) {}
}

const Haptic = {
  ok() { if (WTA && WTA.HapticFeedback) try { WTA.HapticFeedback.notificationOccurred('success'); } catch(e){} },
  warn() { if (WTA && WTA.HapticFeedback) try { WTA.HapticFeedback.notificationOccurred('warning'); } catch(e){} },
  err() { if (WTA && WTA.HapticFeedback) try { WTA.HapticFeedback.notificationOccurred('error'); } catch(e){} },
  tick() { if (WTA && WTA.HapticFeedback) try { WTA.HapticFeedback.impactOccurred('light'); } catch(e){} }
};

/* =========================================================
   2. Optimized Keyed Storage (Telegram CloudStorage + Fallback)
   Каждая тренировка сохраняется отдельным ключом: w_<id>
   Индекс тренировок хранится в ключе fit_idx (массив id)
   Метаданные и программы хранятся в ключе fit_programs
   Черновик активной тренировки хранится в fit_active
   ========================================================= */
const Storage = {
  get hasCloud() {
    return !!(WTA && WTA.CloudStorage && typeof WTA.CloudStorage.getItem === 'function');
  },

  async getItem(key) {
    if (this.hasCloud) {
      try {
        const val = await new Promise((res) => {
          WTA.CloudStorage.getItem(key, (err, result) => {
            if (err) res(null);
            else res(result);
          });
        });
        if (val !== null && val !== undefined && val !== '') return val;
      } catch (e) {}
    }
    try {
      return localStorage.getItem('synchro_' + key);
    } catch (e) {
      return null;
    }
  },

  async setItem(key, val) {
    const sval = typeof val === 'string' ? val : JSON.stringify(val);
    try {
      localStorage.setItem('synchro_' + key, sval);
    } catch (e) {}

    if (this.hasCloud) {
      try {
        await new Promise((res) => {
          WTA.CloudStorage.setItem(key, sval, (err) => res(!err));
        });
      } catch (e) {}
    }
  },

  async removeItem(key) {
    try {
      localStorage.removeItem('synchro_' + key);
    } catch (e) {}
    if (this.hasCloud) {
      try {
        WTA.CloudStorage.removeItem(key, () => {});
      } catch (e) {}
    }
  },

  async getItems(keys) {
    if (!keys || !keys.length) return {};
    const result = {};

    if (this.hasCloud && typeof WTA.CloudStorage.getItems === 'function') {
      try {
        const cloudObj = await new Promise((res) => {
          WTA.CloudStorage.getItems(keys, (err, values) => {
            if (err) res(null);
            else res(values);
          });
        });
        if (cloudObj) {
          for (const k of keys) {
            if (cloudObj[k]) result[k] = cloudObj[k];
          }
        }
      } catch (e) {}
    }

    // fallback to local for any missing keys
    for (const k of keys) {
      if (!result[k]) {
        try {
          const l = localStorage.getItem('synchro_' + k);
          if (l) result[k] = l;
        } catch (e) {}
      }
    }
    return result;
  }
};

/* =========================================================
   3. Default Workout Schedule: Пн, Ср, Пт + Custom
   ========================================================= */
const DEFAULT_PROGRAMS = [
  {
    id: 'prog_mon',
    dayCode: 'mon',
    dayName: 'Понедельник',
    name: 'Грудь + Трицепс + Передняя дельта',
    exercises: [
      { id: 'ex_bench', name: 'Жим штанги лёжа' },
      { id: 'ex_incline_db', name: 'Жим гантелей на наклонной скамье' },
      { id: 'ex_fly', name: 'Разведение гантелей / Бабочка' },
      { id: 'ex_dips', name: 'Отжимания на брусьях' },
      { id: 'ex_tri_cable', name: 'Разгибания на трицепс в блоке' }
    ]
  },
  {
    id: 'prog_wed',
    dayCode: 'wed',
    dayName: 'Среда',
    name: 'Спина + Бицепс + Задняя дельта',
    exercises: [
      { id: 'ex_pullups', name: 'Подтягивания (или верхний блок)' },
      { id: 'ex_barbell_row', name: 'Тяга штанги в наклоне' },
      { id: 'ex_seated_cable', name: 'Тяга горизонтального блока к поясу' },
      { id: 'ex_bicep_bb', name: 'Подъём штанги на бицепс' },
      { id: 'ex_hammer_curl', name: 'Молотковые сгибания с гантелями' }
    ]

/* =========================================================
   4. Application State & Storage Sync
   ========================================================= */
let state = {
  programs: DEFAULT_PROGRAMS,
  workoutIds: [], // list of workout IDs: ['w_20261019_1', ...]
  workouts: {},   // loaded workouts cache: id -> workout object
  active: null    // current active workout session
};

function genId(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
}

async function savePrograms() {
  await Storage.setItem('fit_programs', state.programs);
}

async function saveActiveWorkout() {
  if (state.active) {
    await Storage.setItem('fit_active', state.active);
  } else {
    await Storage.removeItem('fit_active');
  }
}

async function saveCompletedWorkout(workout) {
  // 1. Save workout by its own key
  const key = 'w_' + workout.id;
  await Storage.setItem(key, workout);
  state.workouts[workout.id] = workout;

  // 2. Update index
  if (!state.workoutIds.includes(workout.id)) {
    state.workoutIds.push(workout.id);
    await Storage.setItem('fit_idx', state.workoutIds);
  }
}

async function deleteWorkout(id) {
  state.workoutIds = state.workoutIds.filter(x => x !== id);
  delete state.workouts[id];
  await Storage.setItem('fit_idx', state.workoutIds);
  await Storage.removeItem('w_' + id);
}

/* =========================================================
   5. Helpers & Calculations
   ========================================================= */
const DAYS_MAP = {
  1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat', 0: 'sun'
};
const DAY_NAMES = {
  mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота', sun: 'Воскресенье', any: 'Любой день'
};

function getTodayCode() {
  const d = new Date().getDay();
  return DAYS_MAP[d] || 'any';
}

function getTodayRecommendedProgram() {
  const code = getTodayCode();
  const prog = state.programs.find(p => p.dayCode === code);
  return prog || state.programs[0];
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' +
         d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function fmtShortDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'numeric' });
}

function fmtNum(n) {
  n = Math.round(n || 0);
  return n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + ' т' : n + ' кг';
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Find previous session top set for an exercise
function findPreviousExTop(exId, beforeTs) {
  const list = Object.values(state.workouts)
    .filter(w => new Date(w.date).getTime() < (beforeTs || Date.now()))
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  for (const w of list) {
    const sets = (w.entries && w.entries[exId]) || [];
    const valid = sets.filter(s => (s.done !== false) && s.w && s.r);
    if (valid.length) {
      return valid.reduce((best, cur) => (cur.w > best.w ? cur : best), { w: 0, r: 0 });
    }
  }
  return null;
}

// Compute general training stats
function computeOverviewStats() {
  const list = Object.values(state.workouts);
  if (!list.length) return null;

  const now = Date.now();
  const monthAgo = now - 28 * 864e5;
  const recent = list.filter(w => new Date(w.date).getTime() >= monthAgo);

  const tonnage4w = recent.reduce((sum, w) => sum + (w.totalKg || 0), 0);
  const count4w = recent.length;
  const perWeek = (count4w / 4).toFixed(1);

  return {
    totalWorkouts: list.length,
    tonnage4w: fmtNum(tonnage4w),
    perWeek
  };
}

function updateSetData(exId, setIdx, field, val) {
  if (!state.active || !state.active.entries[exId]) return;
  const num = parseFloat(val);
  state.active.entries[exId][setIdx][field] = isNaN(num) ? '' : num;
}

function onSetFieldChange() {
  saveActiveWorkout();
}

function addSetToExercise(exId) {
  if (!state.active) return;
  if (!state.active.entries[exId]) state.active.entries[exId] = [];
  const sets = state.active.entries[exId];

  // Default weight / reps from last set or previous workout
  let lastW = '';
  let lastR = '';
  if (sets.length > 0) {
    const prevSet = sets[sets.length - 1];
    lastW = prevSet.w || '';
    lastR = prevSet.r || '';
  } else {
    const prevTop = findPreviousExTop(exId, state.active.startedAt);
    if (prevTop) {
      lastW = prevTop.w;
      lastR = prevTop.r;
    }
  }

  sets.push({ w: lastW, r: lastR, done: false });
  Haptic.tick();
  saveActiveWorkout();
  renderWorkoutView();
}

function deleteSet(exId, idx) {
  if (!state.active || !state.active.entries[exId]) return;
  state.active.entries[exId].splice(idx, 1);
  Haptic.tick();
  saveActiveWorkout();
  renderWorkoutView();
}

function toggleSetDone(exId, idx) {
  if (!state.active || !state.active.entries[exId]) return;
  const s = state.active.entries[exId][idx];
  if (!s.w || !s.r) {
    toast('Введи вес и повторения перед отметкой');
    Haptic.warn();
    return;
  }
  s.done = !s.done;
  saveActiveWorkout();

  if (s.done) {
    Haptic.ok();
    startRestTimer();
  } else {
    Haptic.tick();
  }
  renderWorkoutView();
}

function removeExerciseFromSession(exId) {
  if (!state.active) return;
  state.active.exercises = state.active.exercises.filter(e => e.id !== exId);
  delete state.active.entries[exId];
  Haptic.tick();
  saveActiveWorkout();
  renderWorkoutView();
}

function startWorkoutSession(programId) {
  const prog = state.programs.find(p => p.id === programId) || state.programs[0];
  if (!prog) return;

  if (state.active) {
    if (!confirm('У тебя уже начата тренировка! Начать заново новую?')) {
      setView('workout');
      return;
    }
  }

  state.active = {
    id: genId('session'),
    programId: prog.id,
    programName: prog.name,
    startedAt: Date.now(),
    exercises: JSON.parse(JSON.stringify(prog.exercises)),
    entries: {}
  };

  // Pre-seed sets
  prog.exercises.forEach(ex => {
    const prevTop = findPreviousExTop(ex.id, Date.now());
    state.active.entries[ex.id] = [
      { w: prevTop ? prevTop.w : '', r: prevTop ? prevTop.r : '', done: false }
    ];
  });

  saveActiveWorkout();
  Haptic.ok();
  setView('workout');
}

function resumeActiveWorkout() {
  setView('workout');
}

async function finishCurrentWorkout() {
  if (!state.active) return;
  const cur = state.active;

  // Filter and tally completed sets
  let totalKg = 0;
  let totalSets = 0;
  let totalReps = 0;
  const cleanEntries = {};

  Object.keys(cur.entries).forEach(exId => {
    const completed = (cur.entries[exId] || []).filter(s => s.done && s.w > 0 && s.r > 0);
    if (completed.length) {
      cleanEntries[exId] = completed;
      totalSets += completed.length;
      completed.forEach(s => {
        totalReps += Number(s.r);
        totalKg += Number(s.w) * Number(s.r);
      });
    }
  });

  if (totalSets === 0) {
    toast('Отметь хотя бы один подход как «Готово»');
    Haptic.warn();
    return;
  }

  const finishedWorkout = {
    id: cur.id,
    programId: cur.programId,
    programName: cur.programName,
    date: new Date().toISOString(),
    startedAt: cur.startedAt,
    finishedAt: Date.now(),
    durationMin: Math.max(1, Math.round((Date.now() - cur.startedAt) / 60000)),
    totalKg: Math.round(totalKg),
    totalSets,
    totalReps,
    exercises: cur.exercises.filter(e => !!cleanEntries[e.id]),
    entries: cleanEntries
  };

  clearRestTimer();
  await saveCompletedWorkout(finishedWorkout);
  state.active = null;
  await saveActiveWorkout();

  Haptic.ok();
  toast('Тренировка сохранена! Тоннаж: ' + fmtNum(totalKg));
  setView('history');
}

function cancelCurrentWorkout() {
  if (!confirm('Отменить текущую тренировку? Все не сохраненные подходы будут удалены.')) return;
  clearRestTimer();
  state.active = null;
  saveActiveWorkout();
  Haptic.warn();
  setView('home');
}

      <select id="newProgDay" class="field-select">
        <option value="mon">Понедельник</option>
        <option value="tue">Вторник</option>
        <option value="wed">Среда</option>
        <option value="thu">Четверг</option>
        <option value="fri">Пятница</option>
        <option value="sat">Суббота</option>
        <option value="sun">Воскресенье</option>
        <option value="any">Произвольный / Свой день</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Название тренировки</label>
      <input type="text" id="newProgName" class="field-input" placeholder="например: Кардио + Пресс / Full Body">
    </div>
    <button class="btn" onclick="confirmCreateNewProgram()">Создать и перейти к упражнениям</button>
  `;
  modal.classList.add('show');
}

function confirmCreateNewProgram() {
  const name = document.getElementById('newProgName').value.trim();
  const dayCode = document.getElementById('newProgDay').value;
  if (!name) {
    toast('Укажи название программы');
    return;
  }

  const newProg = {
    id: genId('prog'),
    dayCode,
    dayName: DAY_NAMES[dayCode] || 'Свой день',
    name,
    exercises: []
  };

  state.programs.push(newProg);
  savePrograms();
  closeModal();
  Haptic.ok();
  openEditProgramModal(newProg.id);
}

function openEditProgramModal(progId) {
  const prog = state.programs.find(p => p.id === progId);
  if (!prog) return;

  sheet.innerHTML = `
    <div class="sheet-title">
      <span>Редактор программы</span>
      <button class="iconbtn sm" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label class="field-label">День недели</label>
      <select id="editProgDay" class="field-select">
        <option value="mon" ${prog.dayCode === 'mon' ? 'selected' : ''}>Понедельник</option>
        <option value="tue" ${prog.dayCode === 'tue' ? 'selected' : ''}>Вторник</option>
        <option value="wed" ${prog.dayCode === 'wed' ? 'selected' : ''}>Среда</option>
        <option value="thu" ${prog.dayCode === 'thu' ? 'selected' : ''}>Четверг</option>
        <option value="fri" ${prog.dayCode === 'fri' ? 'selected' : ''}>Пятница</option>
        <option value="sat" ${prog.dayCode === 'sat' ? 'selected' : ''}>Суббота</option>
        <option value="sun" ${prog.dayCode === 'sun' ? 'selected' : ''}>Воскресенье</option>
        <option value="any" ${prog.dayCode === 'any' ? 'selected' : ''}>Любой день</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Название программы</label>
      <input type="text" id="editProgName" class="field-input" value="${esc(prog.name)}">
    </div>
    <div class="field">
      <label class="field-label">Список упражнений (${prog.exercises.length})</label>
      <div id="progExList">
        ${prog.exercises.map((ex, i) => `
          <div class="edit-ex-row">
            <span style="font-size:14px; font-weight:600">${i + 1}. ${esc(ex.name)}</span>
            <button class="iconbtn sm" onclick="removeExerciseFromProgram('${prog.id}', '${ex.id}')">✕</button>
          </div>
        `).join('')}
      </div>
      <button class="add-set-btn" style="margin-top:8px" onclick="promptAddExerciseToProgram('${prog.id}')">+ Добавить упражнение</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px">
      <button class="btn" onclick="saveProgramEdits('${prog.id}')">Сохранить изменения</button>
      <button class="btn warn sm" onclick="deleteProgram('${prog.id}')">Удалить эту программу</button>
    </div>
  `;
  modal.classList.add('show');
}

function promptAddExerciseToProgram(progId) {
  const name = prompt('Название упражнения:');
  if (!name || !name.trim()) return;

  const prog = state.programs.find(p => p.id === progId);
  if (prog) {
    prog.exercises.push({ id: genId('ex'), name: name.trim() });
    openEditProgramModal(progId);
  }
}

function removeExerciseFromProgram(progId, exId) {
  const prog = state.programs.find(p => p.id === progId);
  if (prog) {
    prog.exercises = prog.exercises.filter(e => e.id !== exId);
    openEditProgramModal(progId);
  }
}

function saveProgramEdits(progId) {
  const prog = state.programs.find(p => p.id === progId);
  if (!prog) return;

  const name = document.getElementById('editProgName').value.trim();
  const dayCode = document.getElementById('editProgDay').value;

  if (name) prog.name = name;
  prog.dayCode = dayCode;
  prog.dayName = DAY_NAMES[dayCode] || 'День';

  savePrograms();
  closeModal();
  Haptic.ok();
  toast('Программа сохранена');
  render();
}

function deleteProgram(progId) {
  if (state.programs.length <= 1) {
    toast('Нельзя удалить единственную программу');
    return;
  }
  if (!confirm('Точно удалить эту программу?')) return;

  state.programs = state.programs.filter(p => p.id !== progId);
  savePrograms();
  closeModal();
  Haptic.warn();
  toast('Программа удалена');
  render();
}

/* ---------- 6.4 VIEW: PROGRESS & CHARTS ---------- */
let selectedStatExId = null;

function renderStatsView() {
  const allWorkouts = Object.values(state.workouts).sort((a, b) => new Date(a.date) - new Date(b.date));

  // Collect all unique exercises that have been performed
  const performedMap = {};
  allWorkouts.forEach(w => {
    if (w.entries) {
      Object.keys(w.entries).forEach(exId => {
        const matchingEx = (w.exercises || []).find(e => e.id === exId);
        const name = matchingEx ? matchingEx.name : exId;
        performedMap[exId] = name;
      });
    }
  });

  // Also include exercises from existing programs so user can pick any
  state.programs.forEach(p => {
    p.exercises.forEach(e => {
      if (!performedMap[e.id]) performedMap[e.id] = e.name;
    });
  });

  const exKeys = Object.keys(performedMap);
  if (!selectedStatExId || !performedMap[selectedStatExId]) {
    selectedStatExId = exKeys[0] || null;
  }

  let html = `
    <div class="header-top">
      <div class="brand-group">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-title">Статистика прогресса</div>
          <div class="brand-subtitle">Рост весов и тоннажа по датам</div>
        </div>
      </div>
    </div>
  `;

  if (!allWorkouts.length) {
    html += `
      <div class="card">
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <p>Пока нет завершённых тренировок.<br>После 1-2 сессий здесь появятся графики роста рабочих весов!</p>
        </div>
      </div>
    `;
    app.innerHTML = html;
    return;
  }

  // Exercise Selector
  html += `
    <div class="field">
      <label class="field-label">Выберите упражнение для графика</label>
      <select class="field-select" onchange="onSelectStatExercise(this.value)">
        ${exKeys.map(k => `<option value="${k}" ${k === selectedStatExId ? 'selected' : ''}>${esc(performedMap[k])}</option>`).join('')}
      </select>
    </div>
  `;

  // Build chart data for the selected exercise
  const exerciseData = [];
  allWorkouts.forEach(w => {
    const sets = (w.entries && w.entries[selectedStatExId]) || [];
    const valid = sets.filter(s => s.w > 0 && s.r > 0);
    if (valid.length) {
      const maxWeight = Math.max(...valid.map(s => Number(s.w)));
      const vol = valid.reduce((sum, s) => sum + (Number(s.w) * Number(s.r)), 0);
      exerciseData.push({
        date: w.date,
        maxWeight,
        volume: Math.round(vol),
        sets: valid
      });
    }
  });

  if (!exerciseData.length) {
    html += `
      <div class="card">
        <div class="empty-state" style="padding:24px 10px">
          <p>По выбранному упражнению пока нет записей в истории.</p>
        </div>
      </div>
    `;
  } else {
    // Current Best (PR)
    const bestPR = Math.max(...exerciseData.map(d => d.maxWeight));
    const latestWeight = exerciseData[exerciseData.length - 1].maxWeight;
    const firstWeight = exerciseData[0].maxWeight;
    const diff = latestWeight - firstWeight;

    html += `
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Рекорд (PR)</div>
          <div class="stat-val">${bestPR} <b>кг</b></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Динамика</div>
          <div class="stat-val" style="color:${diff >= 0 ? 'var(--acc-light)' : 'var(--danger)'}">
            ${diff > 0 ? '+' + diff : diff} <b>кг</b>
          </div>
        </div>
      </div>

      <div class="chart-container">
        <div class="chart-title">
          <span>График максимального веса (кг)</span>
          <span style="font-size:12px; color:var(--txt-muted)">Сессий: ${exerciseData.length}</span>
        </div>
        ${renderSvgChart(exerciseData)}
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:12px">📋 История подходов по упражнению</div>
    `;

    exerciseData.slice().reverse().forEach(d => {
      html += `
        <div class="hist-item" style="cursor:default">
          <div class="hist-header">
            <span class="hist-title">${fmtShortDate(d.date)} — <b>${d.maxWeight} кг</b></span>
            <span class="hist-tonnage">${fmtNum(d.volume)}</span>
          </div>
          <div class="hist-sub">
            Подходы: ${d.sets.map(s => `${s.w}×${s.r}`).join(', ')}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  app.innerHTML = html;
}

function onSelectStatExercise(exId) {
  selectedStatExId = exId;
  Haptic.tick();
  renderStatsView();
}

function renderSvgChart(data) {
  if (!data || data.length === 0) return '';
  const w = 460;
  const h = 130;
  const padding = 28;

  const weights = data.map(d => d.maxWeight);
  const minW = Math.max(0, Math.min(...weights) - 5);
  const maxW = Math.max(...weights) + 5;
  const range = maxW - minW || 1;

  const points = data.map((d, i) => {
    const x = data.length === 1 ? w / 2 : padding + (i / (data.length - 1)) * (w - padding * 2);
    const y = h - padding - ((d.maxWeight - minW) / range) * (h - padding * 2);
    return { x, y, val: d.maxWeight, date: fmtShortDate(d.date) };
  });

  const pathD = points.length === 1
    ? `M ${points[0].x - 20} ${points[0].y} L ${points[0].x + 20} ${points[0].y}`
    : points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');

  let svg = `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}">
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#2ecc71" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <!-- Horizontal grid line -->
      <line x1="${padding}" y1="${h - padding}" x2="${w - padding}" y2="${h - padding}" stroke="#1b3d2b" stroke-width="1"/>
      <line x1="${padding}" y1="${padding}" x2="${w - padding}" y2="${padding}" stroke="#153323" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Path line -->
      <path d="${pathD}" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  `;

  // Draw points and labels
  points.forEach(p => {
    svg += `
      <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#f0f7f3" stroke="#2ecc71" stroke-width="2.5"/>
      <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" fill="#82a893" font-size="11" font-weight="700">${p.val}</text>
      <text x="${p.x}" y="${h - 8}" text-anchor="middle" fill="#4e735f" font-size="9.5">${p.date}</text>
    `;
  });

  svg += `</svg>`;
  return svg;
}

/* ---------- 6.5 VIEW: HISTORY ---------- */

    .map(id => state.workouts[id])

function openWorkoutDetailModal(workoutId) {

async function confirmDeleteWorkout(id) {
  if (!confirm('Удалить эту тренировку из истории?')) return;
  await deleteWorkout(id);
  closeModal();
  Haptic.warn();
  toast('Запись удалена');
  render();
}

async function confirmClearHistory() {
  if (!confirm('Точно удалить ВСЮ историю тренировок?')) return;
  for (const id of state.workoutIds) {
    await Storage.removeItem('w_' + id);
  }
  state.workoutIds = [];
  state.workouts = {};
  await Storage.setItem('fit_idx', []);
  Haptic.warn();
  toast('Вся история очищена');
  render();
}

/* =========================================================
   7. Rest Timer Logic
   ========================================================= */
const restBar = document.getElementById('rest-bar');
const restTime = document.getElementById('restTime');
const restFill = document.getElementById('restFill');
const restChips = document.getElementById('restChips');

let restTimer = null;
let restEnd = 0;
let restDuration = 90;
const PRESET_DURATIONS = [60, 90, 120, 180];

function buildRestPresetChips() {
  restChips.innerHTML = '';
  PRESET_DURATIONS.forEach(sec => {
    const chip = document.createElement('button');
    chip.className = 'chip ' + (sec === restDuration ? 'active' : '');
    chip.textContent = sec === 60 ? '1:00' : (sec === 90 ? '1:30' : (sec === 120 ? '2:00' : '3:00'));
    chip.onclick = () => {
      restDuration = sec;
      buildRestPresetChips();
      if (restTimer) {
        restEnd = Date.now() + restDuration * 1000;
        tickRest();
      }
    };
    restChips.appendChild(chip);
  });
}

function startRestTimer() {
  buildRestPresetChips();
  restEnd = Date.now() + restDuration * 1000;
  restBar.classList.add('show');
  clearInterval(restTimer);
  restTimer = setInterval(tickRest, 250);
  tickRest();
}

function tickRest() {
  const remaining = Math.max(0, restEnd - Date.now());
  const totalSec = Math.ceil(remaining / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;

  restTime.textContent = (m > 0 ? m + ':' + (s < 10 ? '0' : '') + s : s + 'с');
  restFill.style.width = (remaining / (restDuration * 1000) * 100) + '%';

  if (remaining <= 0) {
    clearInterval(restTimer);
    restTimer = null;
    restFill.style.width = '0%';
    restBar.classList.remove('show');
    Haptic.warn();
    toast('⏱ Отдых завершён — следующий подход!');
  }
}

function clearRestTimer() {
  if (restTimer) {
    clearInterval(restTimer);
    restTimer = null;
  }
  restBar.classList.remove('show');
}
restTime.onclick = () => {
  clearRestTimer();
  Haptic.tick();
};

/* =========================================================
   8. Router & Initial Boot
   ========================================================= */
function render() {
  if (curView === 'home') renderHome();
  else if (curView === 'workout') renderWorkoutView();
  else if (curView === 'programs') renderProgramsView();
  else if (curView === 'stats') renderStatsView();
  else if (curView === 'history') renderHistoryView();
}

async function boot() {
  try {
    // 1. Load programs
    const rawProgs = await Storage.getItem('fit_programs');
    if (rawProgs) {
      try {
        const parsed = typeof rawProgs === 'string' ? JSON.parse(rawProgs) : rawProgs;
        if (Array.isArray(parsed) && parsed.length) {
          state.programs = parsed;
        }
      } catch (e) {}
    }

    // 2. Load active workout if exists
    const rawActive = await Storage.getItem('fit_active');
    if (rawActive) {
      try {
        state.active = typeof rawActive === 'string' ? JSON.parse(rawActive) : rawActive;
      } catch (e) {}
    }

    // 3. Load workout index & items
    const rawIdx = await Storage.getItem('fit_idx');
    if (rawIdx) {
      try {
        const idx = typeof rawIdx === 'string' ? JSON.parse(rawIdx) : rawIdx;
        if (Array.isArray(idx)) {
          state.workoutIds = idx;
        }
      } catch (e) {}
    }

    // Batch load all workouts by individual keys (w_<id>)
    if (state.workoutIds.length) {
      const keys = state.workoutIds.map(id => 'w_' + id);
      const itemsMap = await Storage.getItems(keys);

      for (const id of state.workoutIds) {
        const key = 'w_' + id;
        if (itemsMap[key]) {
          try {
            const w = typeof itemsMap[key] === 'string' ? JSON.parse(itemsMap[key]) : itemsMap[key];
            if (w && w.id) state.workouts[w.id] = w;
          } catch (e) {}
        }
      }
    }

    // 4. Migrate old single-key storage if legacy user
    const legacyRaw = await Storage.getItem('sa_fit_v1');
    if (legacyRaw && !state.workoutIds.length) {
      try {
        const legacy = JSON.parse(legacyRaw);
        if (legacy && Array.isArray(legacy.history) && legacy.history.length) {
          for (const oldW of legacy.history) {
            const wid = oldW.id || genId('migrated');
            const wObj = {
              id: wid,
              programId: oldW.programId || 'ppl',
              programName: 'Тренировка',
              date: oldW.date || new Date().toISOString(),
              totalKg: oldW.totalKg || 0,
              totalSets: oldW.exercises || 3,
              entries: oldW.entries || {}
            };
            await saveCompletedWorkout(wObj);
          }
        }
      } catch (e) {}
    }
  } catch (err) {
    console.error('Storage boot error:', err);
  }

  // Initial view
  if (state.active) {
    curView = 'workout';
  } else {
    curView = 'home';
  }

  buildRestPresetChips();
  render();
}

boot();
</script>
