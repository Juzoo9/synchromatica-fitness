<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Synchromatica Fitness — Трекер и Аналитика</title>
<style>
  :root {
    /* Backgrounds: Deep calm forest pine */
    --bg: #09130e;
    --bg-surface: #0e1c15;
    --card: #12221a;
    --card-hover: #16281f;
    --card-border: rgba(162, 199, 178, 0.08);
    --card-border-subtle: rgba(162, 199, 178, 0.04);

    /* Typography: Off-white/cream headers, soft muted secondary */
    --txt: #f3f6f4;
    --txt-muted: #829b8d;
    --txt-dim: #556c60;

    /* Accents: Soft pastel sage and mint (Strictly non-neon) */
    --acc: #88c2a2;
    --acc-light: #a9d9c0;
    --acc-dark: #6fa88a;
    --acc-glow: rgba(136, 194, 162, 0.12);

    /* Status accents (muted & calm) */
    --warn: #d4a373;
    --danger: #cf7373;
    --blue: #7da5b8;
    --purple: #9b8ab4;

    /* Sizing & Touch Targets (Hick's & Fitts's Laws) */
    --radius: 20px;
    --radius-sm: 12px;
    --radius-btn: 16px;
    --tap-target: 56px;
    --shadow: 0 12px 32px rgba(4, 10, 7, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    background-color: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  body {
    background: radial-gradient(1000px 500px at 50% -5%, #13241b 0%, var(--bg) 60%);
    display: flex;
    flex-direction: column;
  }

  /* Container adapts: Narrow on mobile, spacious grid on desktop */
  #app {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px);
    transition: max-width 0.25s ease;
  }

  /* Desktop layout adaptations */
  @media (min-width: 768px) {
    #app {
      max-width: 1020px;
      padding: 24px 28px 48px;
    }
    .desktop-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: start;
    }
    .desktop-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    /* Hide bottom bar on desktop, use header top nav instead */
    .navbar {
      display: none !important;
    }
    .desktop-nav {
      display: flex !important;
    }
  }

  @media (max-width: 767px) {
    .desktop-nav {
      display: none !important;
    }
    .desktop-grid {
      display: block;
    }
  }

  /* Header Top Bar */
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--card-border-subtle);
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--acc);
    box-shadow: 0 0 16px var(--acc);
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: var(--txt);
  }
  .brand-subtitle {
    font-size: 12.5px;
    color: var(--txt-muted);
    font-weight: 500;
  }

  /* Desktop Top Navigation Tabs */
  .desktop-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #09170f;
    border: 1px solid var(--card-border-subtle);
    border-radius: 12px;
    padding: 4px;
  }
  .desktop-nav-btn {
    background: transparent;
    border: none;
    color: var(--txt-muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .desktop-nav-btn:hover {
    color: var(--txt);
    background: rgba(46, 204, 113, 0.08);
  }
  .desktop-nav-btn.active {
    background: var(--acc);
    color: #03140a;
    font-weight: 700;
  }

  /* Icon Buttons */
  .iconbtn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--txt);
    border-radius: 12px;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn.sm { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  .card:hover {
    border-color: #214b34;
  }
  .card.highlight {
    border-color: var(--acc-dark);
    background: linear-gradient(160deg, #102d1d 0%, var(--card) 100%);
  }
  .card.coach {
    border-color: #2a5038;
    background: linear-gradient(165deg, #0f2b1c 0%, #0d1e15 100%);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--txt);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--txt-muted);
    line-height: 1.45;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--card-border);
    color: var(--txt-muted);
  }
  .badge.today { background: var(--acc-glow); color: var(--acc-light); border: 1px solid var(--acc-dark); }
  .badge.blue { background: rgba(56, 189, 248, 0.15); color: var(--blue); border: 1px solid rgba(56, 189, 248, 0.3); }
  .badge.overload { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
  .badge.plateau { background: rgba(168, 85, 247, 0.16); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }

  /* Buttons */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 18px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--acc), var(--acc-light));
    color: #03140a;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.1px;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { box-shadow: 0 4px 18px rgba(46, 204, 113, 0.35); }
  .btn:active { transform: scale(0.98); }
  .btn.ghost {
    background: var(--card-border-subtle);
    color: var(--txt);
    border: 1px solid var(--card-border);
  }
  .btn.ghost:hover {
    background: var(--card-border);
    box-shadow: none;
  }
  .btn.sm {
    padding: 9px 13px;
    font-size: 13px;
    border-radius: 10px;
  }
  .btn.warn {
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .btn.warn:hover {
    background: rgba(239, 68, 68, 0.22);
    box-shadow: none;
  }

  /* Schedule Cards */
  .day-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .day-card:hover {
    border-color: #275a3e;
    transform: translateY(-1px);
  }
  .day-card:active { transform: scale(0.99); }
  .day-card.active-today {
    border-color: var(--acc);
    box-shadow: 0 0 18px rgba(46, 204, 113, 0.18);
    background: linear-gradient(145deg, #102a1c 0%, var(--card) 100%);
  }
  .day-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }
  .day-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--txt);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .day-info {
    font-size: 12.5px;
    color: var(--txt-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Exercise Workout Blocks */
  .exblk {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 15px;
    margin-bottom: 14px;
  }
  .exblk-hd {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .ex-name { font-size: 16px; font-weight: 700; color: var(--txt); }
  .ex-sub { font-size: 12px; color: var(--txt-muted); margin-top: 2px; }

  /* Coach Progressive Overload Box */
  .coach-tip-box {
    background: #0a1f13;
    border: 1px solid #1a4a2d;
    border-radius: 11px;
    padding: 9px 12px;
    font-size: 12.5px;
    color: #a4ddbd;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.45;
  }
  .coach-tip-box.upgrade {
    background: #191f0c;
    border-color: #4a441a;
    color: #fce891;
  }
  .coach-tip-box.plateau {
    background: #181124;
    border-color: #3b2359;
    color: #dab8fc;
  }
  .coach-tip-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  .setrow {
    display: grid;
    grid-template-columns: 24px 1fr 1fr 82px 34px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-idx {
    font-size: 13px;
    font-weight: 700;
    color: var(--txt-dim);
    text-align: center;
  }
  .inp {
    background: #07150e;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 8px;
    color: var(--txt);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    -moz-appearance: textfield;
  }
  .inp:focus { outline: none; border-color: var(--acc); background: #0a1c13; }
  .inp::-webkit-outer-spin-button, .inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .check-btn {
    height: 38px;
    background: var(--card-border-subtle);
    border: 1px solid var(--card-border);
    color: var(--txt-muted);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .check-btn.done {
    background: linear-gradient(135deg, var(--acc), var(--acc-light));
    color: #03140a;
    border-color: var(--acc);
    box-shadow: 0 0 12px var(--acc-glow);
  }

  .add-set-btn {
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--card-border);
    background: transparent;
    color: var(--acc-light);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s ease;
  }
  .add-set-btn:hover { background: rgba(46, 204, 113, 0.08); }

  /* Rest Timer Overlay Bar */
  #rest-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 74px;
    z-index: 45;
    max-width: 520px;
    margin: 0 auto;
    background: rgba(12, 28, 19, 0.96);
    border-top: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    transform: translateY(160%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (min-width: 768px) {
    #rest-bar { bottom: 20px; border-radius: 14px; border: 1px solid var(--acc-dark); }
  }
  #rest-bar.show { transform: translateY(0); }
  .rest-track {
    height: 4px;
    background: #08150e;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .rest-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--acc), var(--acc-light));
    width: 100%;
    transition: width 0.2s linear;
  }
  .rest-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .rest-time {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--txt);
    cursor: pointer;
  }
  .rest-chips { display: flex; gap: 6px; }
  .chip {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--txt-muted);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .chip:hover { color: var(--txt); }
  .chip.active {
    background: var(--acc);
    color: #03140a;
    border-color: var(--acc);
  }

  /* Bottom Navigation Bar (Mobile / TG Mini App) */
  .navbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    max-width: 540px;
    margin: 0 auto;
    background: rgba(7, 16, 11, 0.95);
    border-top: 1px solid var(--card-border-subtle);
    backdrop-filter: blur(14px);
    padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: none;
    color: var(--txt-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 10px;
    transition: color 0.15s ease;
  }
  .nav-item.active { color: var(--acc-light); }
  .nav-icon { font-size: 18px; }

  /* Toast Notification */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top) + 16px);
    transform: translateX(-50%) translateY(-150%);
    background: #143522;
    border: 1px solid var(--acc);
    color: var(--txt);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    z-index: 90;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Modal Sheet */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(4, 9, 6, 0.75);
    backdrop-filter: blur(5px);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .sheet {
    width: 100%;
    max-width: 580px;
    background: #0b1a11;
    border: 1px solid var(--card-border);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(env(safe-area-inset-bottom) + 24px);
    max-height: 85vh;
    overflow-y: auto;
  }
  @media (min-width: 768px) {
    .modal-overlay { align-items: center; }
    .sheet { border-radius: 22px; border-bottom: 1px solid var(--card-border); max-height: 80vh; }
  }
  .sheet-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .field { margin-bottom: 14px; }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--txt-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .field-input, .field-select {
    width: 100%;
    background: #07150d;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--txt);
    font-size: 15px;
  }
  .field-input:focus, .field-select:focus { outline: none; border-color: var(--acc); }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat-label { font-size: 11.5px; color: var(--txt-muted); font-weight: 600; }
  .stat-val { font-size: 22px; font-weight: 800; color: var(--txt); margin-top: 4px; }
  .stat-val b { color: var(--acc-light); font-size: 14px; margin-left: 2px; }

  /* Chart SVG */
  .chart-container {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 12px;
    margin-bottom: 14px;
  }
  .chart-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chart-svg { width: 100%; height: 160px; overflow: visible; }

  /* History list */
  .hist-item {
    padding: 12px 6px;
    border-bottom: 1px solid var(--card-border-subtle);
    cursor: pointer;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .hist-title { font-size: 15px; font-weight: 700; color: var(--txt); }
  .hist-tonnage { font-size: 14px; font-weight: 800; color: var(--acc-light); }
  .hist-sub { font-size: 12px; color: var(--txt-muted); }

  .empty-state { text-align: center; padding: 36px 16px; color: var(--txt-muted); }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  .edit-ex-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #08170f;
    border: 1px solid var(--card-border-subtle);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }

  /* Commercial Lead Footer Banner */
  .footer-lead-bar {
    margin-top: 26px;
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(17, 36, 26, 0.95), rgba(13, 30, 21, 0.95));
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .footer-lead-bar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--acc), transparent);
  }
  .footer-lead-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(82, 199, 136, 0.12);
    border: 1px solid rgba(82, 199, 136, 0.25);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: var(--acc-light);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .footer-lead-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--txt);
    margin-bottom: 6px;
    line-height: 1.35;
  }
  .footer-lead-desc {
    font-size: 12.5px;
    color: var(--txt-muted);
    margin-bottom: 14px;
    line-height: 1.45;
  }
  .footer-lead-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    padding: 10px 18px;
    background: linear-gradient(135deg, var(--acc), var(--acc-dark));
    color: #061109 !important;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(82, 199, 136, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

/* =========================================================
   2. One-Way Cryptographic Hashing (SHA-256) & AES-GCM Storage Encryption
   ========================================================= */
const CryptoHelper = {
  SALT: 'synchro_salt_sec_2026_fit_',

  // One-way irreversible SHA-256 hash (never exposes raw Telegram ID)
  async sha256(str) {
    const enc = new TextEncoder().encode(str);
    const hashBuf = await crypto.subtle.digest('SHA-256', enc);
    const hashArr = Array.from(new Uint8Array(hashBuf));
    return hashArr.map(b => b.toString(16).padStart(2, '0')).join('');
  },

  // Derive AES-256 encryption key from one-way user token
  async deriveKey(token) {
    const enc = new TextEncoder().encode(token);
    const keyMat = await crypto.subtle.importKey(
      'raw', enc, { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: new TextEncoder().encode('synchro_aes_salt_2026'),
        iterations: 20000,
        hash: 'SHA-256'
      },
      keyMat,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  },

  // Encrypt plaintext into AES-GCM ciphertext
  async encrypt(dataStr, token) {
    if (!token || typeof dataStr !== 'string') return dataStr;
    try {
      const key = await this.deriveKey(token);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder().encode(dataStr);
      const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
      const ivHex = Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join('');
      const cipherHex = Array.from(new Uint8Array(cipherBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
      return 'enc_v1:' + ivHex + ':' + cipherHex;
    } catch (e) {
      return dataStr;
    }
  },

  // Decrypt AES-GCM ciphertext
  async decrypt(dataStr, token) {
    if (!dataStr || typeof dataStr !== 'string' || !dataStr.startsWith('enc_v1:')) {
      return dataStr; // Legacy unencrypted or raw JSON
    }
    if (!token) return null;
    try {
      const parts = dataStr.split(':');
      if (parts.length !== 3) return dataStr;
      const iv = new Uint8Array(parts[1].match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
      const cipherBuf = new Uint8Array(parts[2].match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
      const key = await this.deriveKey(token);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipherBuf);
      return new TextDecoder().decode(plainBuf);
    } catch (e) {
      return null;
    }
  }
};

const Storage = {

  userToken: null,

  // Initialize secure one-way identity before reading/writing
  async initIdentity() {

    if (tgUserId) {
      this.userToken = await CryptoHelper.sha256(CryptoHelper.SALT + tgUserId);
      this.userPrefix = 'tk_' + this.userToken.slice(0, 16) + '_';
      return;
    }

    // 2. From URL ?token=...

    if (urlToken && urlToken.length >= 16) {
      this.userToken = urlToken;

      this.userPrefix = 'tk_' + this.userToken.slice(0, 16) + '_';

    // 4. From localStorage cached token

      const cached = localStorage.getItem('synchro_user_token');

        this.userPrefix = 'tk_' + this.userToken.slice(0, 16) + '_';
        return;
      }
    } catch(e){}

    // 5. Generate secure random client token
    const randBuf = crypto.getRandomValues(new Uint8Array(16));
    const randHex = Array.from(randBuf).map(b => b.toString(16).padStart(2, '0')).join('');
    this.userToken = await CryptoHelper.sha256(CryptoHelper.SALT + randHex);
    try { localStorage.setItem('synchro_user_token', this.userToken); } catch(e){}
    this.userPrefix = 'tk_' + this.userToken.slice(0, 16) + '_';
  },

  _cloudQueue: new Map(),
  _cloudTimer: null,

  async getItem(key) {
    let raw = null;

    // 1. Try CloudStorage
    if (this.hasCloud) {
      try {
        raw = await new Promise((res) => {
          WTA.CloudStorage.getItem(key, (err, result) => {
            if (err) res(null);
            else res(result);
          });
        });
      } catch (e) {}
    }

    // 2. LocalStorage with user namespace isolation
    if (raw === null || raw === undefined || raw === '') {
      try {
        raw = localStorage.getItem('synchro_' + this.userPrefix + key);
        if (raw === null) raw = localStorage.getItem('synchro_' + key);
      } catch (e) {}
    }

    if (!raw) return null;
    return await CryptoHelper.decrypt(raw, this.userToken);
  },

  async setItem(key, val) {
    const sval = typeof val === 'string' ? val : JSON.stringify(val);
    const encVal = await CryptoHelper.encrypt(sval, this.userToken);

    // Instant local save (encrypted)
    try {
      localStorage.setItem('synchro_' + this.userPrefix + key, encVal);
    } catch (e) {}

    // Rate-limited CloudStorage save (encrypted)
    if (this.hasCloud) {
      this._cloudQueue.set(key, encVal);
      if (!this._cloudTimer) {
        this._cloudTimer = setTimeout(() => this._flushCloudQueue(), 300);
      }
    }
  },

  async _flushCloudQueue() {
    this._cloudTimer = null;
    if (!this.hasCloud || this._cloudQueue.size === 0) return;

    const entries = Array.from(this._cloudQueue.entries());
    this._cloudQueue.clear();

    for (const [k, v] of entries) {
      try {
        await new Promise((res) => {
          WTA.CloudStorage.setItem(k, v, (err) => res(!err));
        });
      } catch (e) {}

      localStorage.removeItem('synchro_' + this.userPrefix + key);
      localStorage.removeItem('synchro_' + key);

    if (this.hasCloud) {

    if (this.hasCloud && typeof WTA.CloudStorage.getItems === 'function') {

          if (l) rawMap[k] = l;

      }
    }

    const decryptedMap = {};
    for (const k of keys) {
      if (rawMap[k]) {
        decryptedMap[k] = await CryptoHelper.decrypt(rawMap[k], this.userToken);
      }
    }
    return decryptedMap;

/* =========================================================
   5. Sports Science & Progressive Overload Engine
   (Мировые методики: NSCA 2-for-2 Rule, Double Progression, Plateau Detection)
   ========================================================= */
const DAYS_MAP = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat', 0: 'sun' };
const DAY_NAMES = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота', sun: 'Воскресенье', any: 'Любой день' };

}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' +
         d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function fmtShortDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'numeric' });
}

function fmtNum(n) {
  n = Math.round(n || 0);
  return n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + ' т' : n + ' кг';
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Find previous sessions history for an exercise (ordered newest to oldest)
function getExerciseHistory(exId, beforeTs) {
  return Object.values(state.workouts)
    .filter(w => new Date(w.date).getTime() < (beforeTs || Date.now()))
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .map(w => {
      const sets = (w.entries && w.entries[exId]) || [];
      const valid = sets.filter(s => s.w > 0 && s.r > 0 && s.done !== false);
      if (!valid.length) return null;
      const maxW = Math.max(...valid.map(s => Number(s.w)));
      const topSet = valid.find(s => Number(s.w) === maxW) || valid[0];
      return {
        date: w.date,
        sets: valid,
        maxWeight: maxW,
        topSet,
        totalVolume: valid.reduce((sum, s) => sum + (s.w * s.r), 0)
      };
    })
    .filter(Boolean);
}

// Science-based coach recommendation generator for an exercise
function getExerciseProgressionAdvice(exId, beforeTs) {
  const history = getExerciseHistory(exId, beforeTs);
  if (!history.length) {
    return {
      status: 'neutral',
      title: 'Новое упражнение',
      text: 'Подбери рабочий вес, с которым сможешь уверенно выполнить 8-10 повторений с запасом в 1-2 повтора (RIR 1-2).'
    };
  }

  const latest = history[0];
  const isLower = exId.includes('squat') || exId.includes('leg') || exId.includes('dead');
  const recommendedIncrement = isLower ? 5 : 2.5;

  // 1. NSCA 2-for-2 Rule:
  // If user completed high reps (>= 10 or >= target) with the same weight across last 2 sessions
  if (history.length >= 2) {
    const prev = history[1];
    const sameWeight = Math.abs(latest.maxWeight - prev.maxWeight) < 0.1;

    // Both sessions did 10+ reps or high reps
    if (sameWeight && latest.topSet.r >= 10 && prev.topSet.r >= 10) {
      const newWeight = latest.maxWeight + recommendedIncrement;
      return {
        status: 'upgrade',
        weight: newWeight,
        increment: recommendedIncrement,
        title: '🔥 Пора повышать вес! (Правило NSCA 2-for-2)',
        text: `Ты закрыл вес <b>${latest.maxWeight} кг</b> 2 тренировки подряд на 10+ повторений (${prev.topSet.r} и ${latest.topSet.r} повт). Рекомендация тренера: <b>накинь +${recommendedIncrement} кг</b> (новый рабочий вес: <b>${newWeight} кг</b>)!`
      };
    }
  }

  // 2. Plateau detection:
  // If user used the exact same weight for 3 or more sessions without rep growth
  if (history.length >= 3) {
    const last3 = history.slice(0, 3);
    const weights = last3.map(h => h.maxWeight);
    const allSame = weights.every(w => Math.abs(w - weights[0]) < 0.1);
    if (allSame) {
      const reps = last3.map(h => h.topSet.r);
      const repsDiff = reps[0] - reps[reps.length - 1];
      if (repsDiff <= 1) {
        return {
          status: 'plateau',
          weight: latest.maxWeight + (isLower ? 2.5 : 1.25),
          title: '⚠️ Плато на весе ' + latest.maxWeight + ' кг',
          text: `Вес держится уже 3 сессии подряд. Совет мировых тренеров: сделай силовой шаг — накинь минимальные <b>+${isLower ? 2.5 : 1.25} кг</b> и сделай 5-6 повторений, либо смени упражнение на 2 недели для мышечной адаптации.`
        };
      }
    }
  }

  // 3. Normal progression hint (Double progression method - Eric Helms)
  if (latest.topSet.r >= 10) {
    return {
      status: 'upgrade',
      weight: latest.maxWeight + recommendedIncrement,
      increment: recommendedIncrement,
      title: '📈 Отличный запас повторений',
      text: `В прошлый раз ты закрыл <b>${latest.maxWeight} кг × ${latest.topSet.r}</b>. Попробуй в первом рабочем подходе взять <b>${latest.maxWeight + recommendedIncrement} кг</b> на 6-8 повторений.`
    };
  }

  // Still working in the rep range
  return {
    status: 'maintain',
    weight: latest.maxWeight,
    title: '🎯 Закрепляй рабочий вес',
    text: `Прошлый результат: <b>${latest.maxWeight} кг × ${latest.topSet.r}</b>. Твоя цель сегодня — добавить +1-2 повторения с этим же весом перед переходом на более тяжелый.`
  };
}

  const list = Object.values(state.workouts);

  const now = Date.now();
  const monthAgo = now - 28 * 864e5;
  const recent = list.filter(w => new Date(w.date).getTime() >= monthAgo);

  return {
    totalWorkouts: list.length,
    tonnage4w: fmtNum(recent.reduce((sum, w) => sum + (w.totalKg || 0), 0)),
    perWeek: (recent.length / 4).toFixed(1)
  };
}

async function saveManualUid() {
  const inp = document.getElementById('manualUidInput');
  const val = inp && inp.value.trim();
  if (!val) {
    toast('Введите корректный Telegram ID');
    return;
  }
  const token = await CryptoHelper.sha256(CryptoHelper.SALT + val);
  localStorage.setItem('synchro_user_token', token);
  Haptic.ok();
  toast('ID надёжно захэширован! Обновление...');
  setTimeout(() => {
    window.location.href = window.location.origin + window.location.pathname + '?token=' + encodeURIComponent(token);
  }, 400);
}

function updateSetData(exId, setIdx, field, val) {
  if (!state.active || !state.active.entries[exId]) return;
  const num = parseFloat(val);
  state.active.entries[exId][setIdx][field] = isNaN(num) ? '' : num;
}

function onSetFieldChange() { saveActiveWorkout(); }

function addSetToExercise(exId) {
  if (!state.active) return;
  if (!state.active.entries[exId]) state.active.entries[exId] = [];
  const sets = state.active.entries[exId];

  let lastW = '';
  let lastR = '';
  if (sets.length > 0) {
    const prevSet = sets[sets.length - 1];
    lastW = prevSet.w || '';
    lastR = prevSet.r || '';
  } else {
    const history = getExerciseHistory(exId, state.active.startedAt);
    if (history.length) {
      lastW = history[0].topSet.w;
      lastR = history[0].topSet.r;
    }
  }

  sets.push({ w: lastW, r: lastR, done: false });
  Haptic.tick();
  saveActiveWorkout();
  renderWorkoutView();
}

function deleteSet(exId, idx) {
  if (!state.active || !state.active.entries[exId]) return;
  state.active.entries[exId].splice(idx, 1);
  Haptic.tick();
  saveActiveWorkout();
  renderWorkoutView();
}

function toggleSetDone(exId, idx) {
  if (!state.active || !state.active.entries[exId]) return;
  const s = state.active.entries[exId][idx];
  if (!s.w || !s.r) {
    toast('Введи вес и повторения перед отметкой');
    Haptic.warn();
    return;
  }
  s.done = !s.done;
  saveActiveWorkout();

  if (s.done) {
    Haptic.ok();
    startRestTimer();
  } else {
    Haptic.tick();
  }
  renderWorkoutView();
}

function removeExerciseFromSession(exId) {
  if (!state.active) return;
  state.active.exercises = state.active.exercises.filter(e => e.id !== exId);
  delete state.active.entries[exId];
  Haptic.tick();
  saveActiveWorkout();
  renderWorkoutView();
}

function startWorkoutSession(programId) {
  const prog = state.programs.find(p => p.id === programId) || state.programs[0];
  if (!prog) return;

  if (state.active) {
    if (!confirm('У тебя уже начата тренировка! Начать новую с нуля?')) {
      setView('workout');
      return;
    }
  }

  state.active = {
    id: genId('session'),
    programId: prog.id,
    programName: prog.name,
    startedAt: Date.now(),
    exercises: JSON.parse(JSON.stringify(prog.exercises)),
    entries: {}
  };

  prog.exercises.forEach(ex => {
    const history = getExerciseHistory(ex.id, Date.now());
    const topW = history.length ? history[0].topSet.w : '';
    const topR = history.length ? history[0].topSet.r : '';
    state.active.entries[ex.id] = [{ w: topW, r: topR, done: false }];
  });

  saveActiveWorkout();
  Haptic.ok();
  setView('workout');
}

function resumeActiveWorkout() { setView('workout'); }

async function finishCurrentWorkout() {
  if (!state.active) return;
  const cur = state.active;

  let totalKg = 0;
  let totalSets = 0;
  let totalReps = 0;
  const cleanEntries = {};

  Object.keys(cur.entries).forEach(exId => {
    const completed = (cur.entries[exId] || []).filter(s => s.done && s.w > 0 && s.r > 0);
    if (completed.length) {
      cleanEntries[exId] = completed;
      totalSets += completed.length;
      completed.forEach(s => {
        totalReps += Number(s.r);
        totalKg += Number(s.w) * Number(s.r);
      });
    }
  });

  if (totalSets === 0) {
    toast('Отметь хотя бы один подход как «Готово»');
    Haptic.warn();
    return;
  }

  const finishedWorkout = {
    id: cur.id,
    programId: cur.programId,
    programName: cur.programName,
    date: new Date().toISOString(),
    startedAt: cur.startedAt,
    finishedAt: Date.now(),
    durationMin: Math.max(1, Math.round((Date.now() - cur.startedAt) / 60000)),
    totalKg: Math.round(totalKg),
    totalSets,
    totalReps,
    exercises: cur.exercises.filter(e => !!cleanEntries[e.id]),
    entries: cleanEntries
  };

  clearRestTimer();
  await saveCompletedWorkout(finishedWorkout);
  state.active = null;
  await saveActiveWorkout();

  Haptic.ok();
  toast('Тренировка сохранена! Тоннаж: ' + fmtNum(totalKg));
  setView('history');
}

let selectedStatExId = null;

function renderStatsView() {
  const allWorkouts = Object.values(state.workouts).sort((a, b) => new Date(a.date) - new Date(b.date));

  const performedMap = {};
  allWorkouts.forEach(w => {
    if (w.entries) {
      Object.keys(w.entries).forEach(exId => {
        const matchingEx = (w.exercises || []).find(e => e.id === exId);
        performedMap[exId] = matchingEx ? matchingEx.name : exId;
      });
    }
  });

  state.programs.forEach(p => {
    p.exercises.forEach(e => {
      if (!performedMap[e.id]) performedMap[e.id] = e.name;
    });
  });

  const exKeys = Object.keys(performedMap);
  if (!selectedStatExId || !performedMap[selectedStatExId]) {
    selectedStatExId = exKeys[0] || null;
  }

  let html = renderHeaderTop();

  if (!allWorkouts.length) {
    html += `
      <div class="card">
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <p>Пока нет завершённых тренировок.<br>После 1-2 сессий здесь появятся графики роста рабочих весов!</p>
        </div>
      </div>
    `;
    app.innerHTML = html;
    return;
  }

  // Exercise Selector
  html += `
    <div class="field">
      <label class="field-label">Выберите упражнение для графика</label>
      <select class="field-select" onchange="onSelectStatExercise(this.value)">
        ${exKeys.map(k => `<option value="${k}" ${k === selectedStatExId ? 'selected' : ''}>${esc(performedMap[k])}</option>`).join('')}
      </select>
    </div>
  `;

  const exerciseData = [];
  allWorkouts.forEach(w => {
    const sets = (w.entries && w.entries[selectedStatExId]) || [];
    const valid = sets.filter(s => s.w > 0 && s.r > 0);
    if (valid.length) {
      const maxWeight = Math.max(...valid.map(s => Number(s.w)));
      const vol = valid.reduce((sum, s) => sum + (Number(s.w) * Number(s.r)), 0);
      exerciseData.push({
        date: w.date,
        maxWeight,
        volume: Math.round(vol),
        sets: valid
      });
    }
  });

  if (!exerciseData.length) {
    html += `
      <div class="card">
        <div class="empty-state" style="padding:24px 10px">
          <p>По выбранному упражнению пока нет записей в истории.</p>
        </div>
      </div>
    `;
  } else {
    const bestPR = Math.max(...exerciseData.map(d => d.maxWeight));
    const latestWeight = exerciseData[exerciseData.length - 1].maxWeight;
    const firstWeight = exerciseData[0].maxWeight;
    const diff = latestWeight - firstWeight;
    const advice = getExerciseProgressionAdvice(selectedStatExId);

    html += `
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Рекорд (PR)</div>
          <div class="stat-val">${bestPR} <b>кг</b></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Динамика</div>
          <div class="stat-val" style="color:${diff >= 0 ? 'var(--acc-light)' : 'var(--danger)'}">
            ${diff > 0 ? '+' + diff : diff} <b>кг</b>
          </div>
        </div>
      </div>

      <!-- Coach advice for this exercise -->
      <div class="coach-tip-box ${advice.status === 'upgrade' ? 'upgrade' : (advice.status === 'plateau' ? 'plateau' : '')}">
        <span class="coach-tip-icon">${advice.status === 'upgrade' ? '🚀' : (advice.status === 'plateau' ? '⚠️' : '💡')}</span>
        <div><b>Рекомендация тренера:</b> ${advice.text}</div>
      </div>

      <div class="chart-container">
        <div class="chart-title">
          <span>График максимального веса (кг)</span>
          <span style="font-size:12px; color:var(--txt-muted)">Сессий: ${exerciseData.length}</span>
        </div>
        ${renderSvgChart(exerciseData)}
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:12px">📋 История подходов по упражнению</div>
    `;

    exerciseData.slice().reverse().forEach(d => {
      html += `
        <div class="hist-item" style="cursor:default">
          <div class="hist-header">
            <span class="hist-title">${fmtShortDate(d.date)} — <b>${d.maxWeight} кг</b></span>
            <span class="hist-tonnage">${fmtNum(d.volume)}</span>
          </div>
          <div class="hist-sub">
            Подходы: ${d.sets.map(s => `${s.w}×${s.r}`).join(', ')}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  app.innerHTML = html;
}

function onSelectStatExercise(exId) {

  renderStatsView();
}

function renderSvgChart(data) {
  if (!data || data.length === 0) return '';
  const w = 500;
  const h = 140;
  const padding = 28;

  const weights = data.map(d => d.maxWeight);
  const minW = Math.max(0, Math.min(...weights) - 5);
  const maxW = Math.max(...weights) + 5;
  const range = maxW - minW || 1;

  const points = data.map((d, i) => {
    const x = data.length === 1 ? w / 2 : padding + (i / (data.length - 1)) * (w - padding * 2);
    const y = h - padding - ((d.maxWeight - minW) / range) * (h - padding * 2);
    return { x, y, val: d.maxWeight, date: fmtShortDate(d.date) };
  });

  const pathD = points.length === 1
    ? `M ${points[0].x - 20} ${points[0].y} L ${points[0].x + 20} ${points[0].y}`
    : points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');

  let svg = `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}">
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#2ecc71" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <line x1="${padding}" y1="${h - padding}" x2="${w - padding}" y2="${h - padding}" stroke="#1b3d2b" stroke-width="1"/>
      <line x1="${padding}" y1="${padding}" x2="${w - padding}" y2="${padding}" stroke="#153323" stroke-dasharray="3,3" stroke-width="1"/>
      <path d="${pathD}" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  `;

  points.forEach(p => {
    svg += `
      <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#f0f7f3" stroke="#2ecc71" stroke-width="2.5"/>
      <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" fill="#82a893" font-size="11" font-weight="700">${p.val}</text>
      <text x="${p.x}" y="${h - 8}" text-anchor="middle" fill="#4e735f" font-size="9.5">${p.date}</text>
    `;
  });

  svg += `</svg>`;
  return svg;
}

function exportBackupJson() {
  const exportData = {
    app: 'synchromatica-fitness',
    exportedAt: new Date().toISOString(),
    programs: state.programs,
    workoutIds: state.workoutIds,
    workouts: state.workouts
  };

  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(exportData, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute('href', dataStr);
  downloadAnchor.setAttribute('download', `synchromatica_backup_${new Date().toISOString().slice(0, 10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();

  Haptic.ok();
  toast('Бэкап успешно скачан ✓');
}

function importBackupJson(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !data.programs || !Array.isArray(data.programs)) {
        toast('Ошибка: Неверный формат файла бэкапа');
        return;
      }

      state.programs = data.programs;
      await savePrograms();

      if (data.workouts && typeof data.workouts === 'object') {
        state.workouts = data.workouts;
        state.workoutIds = data.workoutIds || Object.keys(data.workouts);

        await Storage.setItem('fit_idx', state.workoutIds);
        for (const id of state.workoutIds) {
          if (state.workouts[id]) {
            await Storage.setItem('w_' + id, state.workouts[id]);
          }
        }
      }

      closeModal();
      Haptic.ok();
      toast('Данные успешно восстановлены! ✓');
      render();
    } catch (err) {
      toast('Ошибка при чтении файла');
    }
  };
  reader.readAsText(file);
}

        return `
          <div style="padding:10px 0; border-bottom:1px solid var(--card-border-subtle)">
            <div style="font-size:14.5px; font-weight:700">${esc(ex.name)}</div>
            <div style="font-size:12.5px; color:var(--txt-muted); margin-top:3px">
              ${sets.map((s, idx) => `<b>#${idx + 1}</b> ${s.w} кг × ${s.r}`).join('  |  ')}
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <button class="btn warn sm" style="margin-top:10px" onclick="confirmDeleteWorkout('${w.id}')">Удалить эту запись</button>
  `;
  modal.classList.add('show');
}

async function confirmDeleteWorkout(id) {
  if (!confirm('Удалить эту тренировку из истории?')) return;
  await deleteWorkout(id);
  closeModal();
  Haptic.warn();
  toast('Запись удалена');
  render();
}

async function confirmClearHistory() {
  if (!confirm('Точно удалить ВСЮ историю тренировок?')) return;
  for (const id of state.workoutIds) {
    await Storage.removeItem('w_' + id);
  }
  state.workoutIds = [];
  state.workouts = {};
  await Storage.setItem('fit_idx', []);
  Haptic.warn();
  toast('Вся история очищена');
  render();
}

/* =========================================================
   7. Rest Timer
   ========================================================= */
const restBar = document.getElementById('rest-bar');
const restTime = document.getElementById('restTime');
const restFill = document.getElementById('restFill');
const restChips = document.getElementById('restChips');

let restTimer = null;
let restEnd = 0;
let restDuration = 90;
const PRESET_DURATIONS = [60, 90, 120, 180];

function buildRestPresetChips() {
  restChips.innerHTML = '';
  PRESET_DURATIONS.forEach(sec => {
    const chip = document.createElement('button');
    chip.className = 'chip ' + (sec === restDuration ? 'active' : '');
    chip.textContent = sec === 60 ? '1:00' : (sec === 90 ? '1:30' : (sec === 120 ? '2:00' : '3:00'));
    chip.onclick = () => {
      restDuration = sec;
      buildRestPresetChips();
      if (restTimer) {
        restEnd = Date.now() + restDuration * 1000;
        tickRest();
      }
    };
    restChips.appendChild(chip);
  });
}

function startRestTimer() {
  buildRestPresetChips();
  restEnd = Date.now() + restDuration * 1000;
  restBar.classList.add('show');
  clearInterval(restTimer);
  restTimer = setInterval(tickRest, 250);
  tickRest();
}

function tickRest() {
  const remaining = Math.max(0, restEnd - Date.now());
  const totalSec = Math.ceil(remaining / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;

  restTime.textContent = (m > 0 ? m + ':' + (s < 10 ? '0' : '') + s : s + 'с');
  restFill.style.width = (remaining / (restDuration * 1000) * 100) + '%';

  if (remaining <= 0) {
    clearInterval(restTimer);
    restTimer = null;
    restFill.style.width = '0%';
    restBar.classList.remove('show');
    Haptic.warn();
    toast('⏱ Отдых завершён — следующий подход!');
  }
}

function clearRestTimer() {
  if (restTimer) {
    clearInterval(restTimer);
    restTimer = null;
  }
  restBar.classList.remove('show');
}
restTime.onclick = () => {
  clearRestTimer();
  Haptic.tick();
};

/* =========================================================
   8. Boot
   ========================================================= */
function render() {
  if (curView === 'home') renderHome();
  else if (curView === 'workout') renderWorkoutView();
  else if (curView === 'programs') renderProgramsView();
  else if (curView === 'coach') renderCoachView();
  else if (curView === 'stats') renderStatsView();
  else if (curView === 'history') renderHistoryView();
}

async function boot() {
  try {
    await Storage.initIdentity();

    const rawProgs = await Storage.getItem('fit_programs');
    if (rawProgs) {
      try {
        const parsed = typeof rawProgs === 'string' ? JSON.parse(rawProgs) : rawProgs;
        if (Array.isArray(parsed) && parsed.length) state.programs = parsed;
      } catch (e) {}
    }

    const rawActive = await Storage.getItem('fit_active');
    if (rawActive) {
      try {
        state.active = typeof rawActive === 'string' ? JSON.parse(rawActive) : rawActive;
      } catch (e) {}
    }

    const rawIdx = await Storage.getItem('fit_idx');
    if (rawIdx) {
      try {
        const idx = typeof rawIdx === 'string' ? JSON.parse(rawIdx) : rawIdx;
        if (Array.isArray(idx)) state.workoutIds = idx;
      } catch (e) {}
    }

    if (state.workoutIds.length) {
      const keys = state.workoutIds.map(id => 'w_' + id);
      const itemsMap = await Storage.getItems(keys);
      for (const id of state.workoutIds) {
        const key = 'w_' + id;
        if (itemsMap[key]) {
          try {
            const w = typeof itemsMap[key] === 'string' ? JSON.parse(itemsMap[key]) : itemsMap[key];
            if (w && w.id) state.workouts[w.id] = w;
          } catch (e) {}
        }
      }
    }
  } catch (err) {
    console.error('Storage boot error:', err);
  }

  curView = state.active ? 'workout' : 'home';
  buildRestPresetChips();
  render();
}

boot();
</script>
